name: hasanm08
description: My portfolio website.
publish_to: none
version: 2.1.0

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  shared_preferences: ^2.2.3
  url_launcher: ^6.0.2
  flutter_native_splash: ^2.1.3+1
  provider: ^6.0.2
  flow_routing: ^2.0.0
  flow_showcase: ^1.0.0
  flutter_lints: ^6.0.0
  web: ^1.1.1
dev_dependencies:
  flutter_launcher_icons: ^0.14.2

asset:
  - assets/images/
  - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#0F172A"
    theme_color: "#0175C2"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2-Medium.ttf
    - family: kalame
      fonts:
        - asset: assets/fonts/kalame-bold.ttf
          weight: 700
        - asset: assets/fonts/kalame-regular.ttf
          weight: 400
        - asset: assets/fonts/kalame-light.ttf
          weight: 300
