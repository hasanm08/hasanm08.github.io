name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - source-code
  pull_request:
    branches:
      - source-code

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install
        run: |
          flutter config --enable-web
          flutter pub get

      - name: Build
        run: flutter build web --wasm

      - name: Setup Pages
        if: >-
          github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref == 'refs/heads/source-code')
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/source-code')
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: >-
          github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref == 'refs/heads/source-code')
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/source-code')
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/source-code')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/source-code')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
