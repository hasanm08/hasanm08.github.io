name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - source-code
  pull_request:
    branches:
      - source-code

permissions:
  contents: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install
        run: |
          flutter config --enable-web
          flutter pub get

      # SkWasm (--wasm) uses SharedArrayBuffer; that needs COOP/COEP headers.
      # GitHub Pages cannot set those, so use the default JS web build here.
      - name: Build
        run: flutter build web

      # Path URL strategy: GitHub Pages must serve index.html for unknown paths.
      - name: SPA fallback for deep links
        run: cp build/web/index.html build/web/404.html

      - name: Copy static files (CV, etc.)
        run: cp -r files build/web/files

      - name: Deploy to GitHub Pages
        if: >-
          github.event_name == 'pull_request'
          || (github.event_name == 'push' && github.ref == 'refs/heads/source-code')
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/source-code')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
